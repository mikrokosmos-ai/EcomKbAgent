[project]
name = "ecomkbagent"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "flagembedding>=1.4.2",
    "grandalf>=0.8",
    "langchain>=1.3.17",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "loguru>=0.7.3",
    "magic-pdf>=1.3.12",
    "mineru-open-sdk>=0.2.5",
    "minio>=7.2.20",
    "modelscope>=1.39.1",
    "numpy>=2.4.6",
    "openai-agents>=0.4.2",
    "pandas>=3.0.5",
    "pymilvus>=3.0.1",
    "pymilvus-model>=0.3.2",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "regex>=2026.7.19",
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "torchvision==0.25.0",
    "uvicorn>=0.52.4",
]

[tool.uv.sources]
# 强制从 NVIDIA 源安装
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }
torchaudio = { index = "pytorch-cuda" }

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
